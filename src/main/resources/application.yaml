server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/identityService
    username: user
    password: postgres
  security:
    oauth2:
      resourceserver:
        jwt:
          # URL base que emite os tokens.
          # 8081 e a porta do Keycloak; 8080 e a porta do proprio Spring.
          issuer-uri: http://localhost:8081/realms/ChainTracker
          # Endpoint onde o Spring baixa as chaves públicas para validar o JWT localmente
          jwk-set-uri: http://localhost:8081/realms/ChainTracker/protocol/openid-connect/certs
  kafka:
    producer:
      bootstrap-servers: localhost:9092 # Ajuste para a sua porta/URL
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
